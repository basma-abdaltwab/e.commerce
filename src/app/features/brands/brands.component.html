


<section class="bg-gradient-to-r from-[#8b5cf6] to-[#6d28d9] py-12 px-8 text-white">
  <div class="max-w-7xl mx-auto">
    <nav class="text-sm opacity-80 mb-4">
      <span>Home</span> / <span class="font-semibold">Brands</span>
    </nav>

    <div class="flex items-center gap-4">
      <div class="size-16 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-tags text-3xl"></i>
      </div>
      
      <div>
        <h1 class="text-4xl font-bold tracking-tight">Top Brands</h1>
        <p class="text-white/90 mt-1">Shop from your favorite brands</p>
      </div>
    </div>
  </div>
</section>


<div  class="grid grid-cols-2 gap-4 p-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
 @for (brand of brandList(); track brand._id) {
   <div [routerLink]="['/details-brand' , brand._id]"   class="group cursor-pointer rounded-xl border border-gray-200 bg-white p-4 transition-all duration-300 hover:-translate-1 hover:shadow-lg">
    
    <div  class="flex aspect-square items-center justify-center rounded-xl overflow-hidden mb-3 bg-gray-50 p-4">
      <img title="Img" [src]="brand.image" 
           class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500" 
           [alt]="brand.name">
    </div>

    <div class="mt-3 text-center">
      <h3 class="font-semibold text-gray-900 text-center text-sm group-hover:text-violet-600 transition-colors truncate">{{brand.name}}</h3>
      <div class="flex justify-center mt-1.5 opacity-0 group-hover:opacity-100 transition-opacity"><span class="text-xs text-violet-600 flex items-center gap-1">View Products<i class="fa-solid fa-arrow-right-long"></i> </span></div>
    </div>

  </div>
  
 }
  </div>
